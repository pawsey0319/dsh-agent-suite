name: publish-npm
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing needs >= 11.5)
        run: npm install -g npm@latest
      - name: Publish all packages
        run: |
          set -euo pipefail
          for p in dsh-office-artifacts dsh-judge dsh-agent-bridge dsh-task-radar; do
            echo "== $p =="
            (cd "packages/$p" && npm publish --access public --provenance)
          done
